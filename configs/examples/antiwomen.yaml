# Example: the anti-women hate study (X only, one category, multi-annotator training data,
# spike detection instead of a fixed event list). Paths are illustrative.

project: antiwomen
platforms: [x]
timezone: Australia/Sydney

study_period:
  start: "2025-03-21"
  end: "2026-06-01"

paths:
  raw: raw
  work: work
  models: models

categories:
  anti_women: {label: Anti-women, target_group: Women, threshold: 0.20}

annotations:
  files: [annotations/AntiWomen_Labelled_FullData.csv]
  aggregation: majority
  min_annotations: 1

training:
  base_model: FacebookAI/roberta-large
  max_length: 256
  epochs: 5
  batch_size: 16
  learning_rate: 1.0e-5
  test_size: 0.15
  validation_size: 0.15
  seed: 42

llm:
  categories: {}          # no LLM stage in this project

events: []                # spikes are detected from the data instead
event_window_days: 7
its_pre_days: 21
its_post_days: 14

spikes:
  top: 8
  window_days: 7
  baseline_days: 14
  z_threshold: 3.0
  min_count: 10
  min_separation_days: 15
  volume_fraction: 0.5
  exclude_after_gap_days: 7
  min_baseline_observed_days: 10
  samples_per_period: 10

network:
  min_degree: 5
  max_nodes: 5000

geography:
  population_csv: null
  min_city_users: 20
